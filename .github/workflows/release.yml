# ==============================================================================
#  release.yml — compilation de transcribe et truchement pour chaque système :
#    Linux x86-64 et arm64, Windows x64, macOS Apple Silicon (arm64) et Intel
#    (x64)
#
#  Une clé par architecture : ce workflow produit, pour chacune, l'archive à
#  décompresser à la racine de la clé :
#    transcribe-linux-<arch>.tar.xz  transcribe, truchement, scripts déployés,
#                                    assets/, i18n/, build/whisper/, scripts
#                                    *.sh d'installation et d'usage, download*,
#                                    requirements.txt, tools/tk-xft, LICENSE
#    transcribe-macos-<arch>.tar.xz  idem pour macOS (whisper-cli statique avec
#                                    Metal ; pas de Tk Xft, inutile)
#    whisper-cli-<os>-<arch>.tar.xz  whisper-cli seul (downloads.csv)
#    transcribe-windows-x64.zip      transcribe.exe, truchement.exe, scripts
#                                    déployés, assets/, i18n/, scripts *.bat,
#                                    download*, requirements.txt, LICENSE
#                                    (whisper-cli Windows : zip officiel de
#                                    downloads.csv)
#  puis setupPython_and_download.sh (.bat sous Windows) prépare le Python
#  portable et les composants. Les scripts compiler* ne sont pas inclus : les
#  sources (transcribe-src/, truchement-src/) ne sont pas dans l'archive.
#
#  Linux est compilé dans un conteneur ubuntu:22.04 : PyInstaller embarque les
#  bibliothèques système de la machine de compilation (X11, Xft, fontconfig…),
#  dont la glibc fixe le minimum requis sur les machines cibles — 2.35 ici
#  (Ubuntu 22.04+, Debian 12, Raspberry Pi OS Bookworm, Linux Mint 21+), au
#  lieu de 2.38 avec une image ubuntu-24.04.
#
#  macOS : exécutables simples (pas de paquet .app), signés ad hoc, non
#  notariés. Une archive téléchargée par le navigateur est marquée
#  « quarantaine » : la débloquer après décompression avec
#    xattr -dr com.apple.quarantine <dossier>
#  Intel : runner macos-15-intel (dernière image Intel de GitHub).
#
#  Windows ARM64 : pas de compilation native — ctranslate2 (moteur de
#  traduction d'Argos) ne publie aucune roue win_arm64. Windows 11 ARM fait
#  tourner l'archive x64 par émulation (Prism) ; le job windows-arm64 le
#  vérifie sur le runner windows-11-arm : Python portable x64, dépendances,
#  ffmpeg / whisper-cli / yt-dlp de downloads.csv, lancement des deux .exe.
#  Il ne publie rien et ne bloque pas la release.
#
#  Déclenchement : à la main (onglet Actions → Run workflow), ou en poussant
#  une étiquette v* ou linux-* (git tag v0.5 && git push origin v0.5) : les
#  archives sont alors aussi publiées dans la release de cette étiquette.
# ==============================================================================
name: Release (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    tags: ["v*", "linux-*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Paquets système
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            ca-certificates curl git xz-utils file build-essential cmake \
            libx11-6 libxft2 libfontconfig1 fonts-dejavu-core xvfb xauth
          # arm64 : gcc 11 ne connaît pas armv9.2-a+sme (variante ggml la
          # plus récente) ; tools/whisper/build_whisper.sh prendra clang-15
          if [ "$(uname -m)" = aarch64 ]; then
            apt-get install -y -q --no-install-recommends clang-15
          fi

      - uses: actions/checkout@v7

      - name: Python portable (sans paquets de langues Argos)
        run: bash setup_python.sh --no-lang

      - name: whisper-cli
        run: bash tools/whisper/build_whisper.sh

      - name: Compilation de transcribe et truchement
        run: bash compiler.sh

      - name: Essai de lancement (Xvfb)
        run: |
          # Toujours en marche au bout de 20 s (code 124) = démarrage réussi
          for app in transcribe truchement; do
            set +e
            xvfb-run -a timeout 20 ./"$app" > "$app.log" 2>&1
            rc=$?
            set -e
            echo "$app : code $rc"
            if [ "$rc" -ne 124 ]; then tail -20 "$app.log"; exit 1; fi
          done
          build/whisper/whisper-cli --help > /dev/null

      - name: Archives
        run: |
          mkdir -p dist
          # scripts *.sh sauf compiler* (sources absentes de l'archive) ;
          # tools/tk-xft : Tk avec Xft, posé par setup_python.sh
          scripts=$(ls *.sh | grep -v '^compiler')
          tar -cJf "dist/transcribe-linux-${{ matrix.arch }}.tar.xz" \
            transcribe truchement traduire-srt.py nettoyer-srt.py \
            traduire-livre.py assets i18n build/whisper \
            $scripts download_from_csv.py downloads.csv requirements.txt \
            tools/tk-xft/install_tk_xft.sh "tools/tk-xft/$(uname -m)" \
            LICENSE README.md
          tar -C build/whisper -cJf "dist/whisper-cli-linux-${{ matrix.arch }}.tar.xz" .
          file transcribe truchement build/whisper/whisper-cli
          tar -tJf "dist/transcribe-linux-${{ matrix.arch }}.tar.xz" | grep -v '^assets/\|^i18n/\|^build/'
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Python portable (sans paquets de langues Argos)
        run: bash setup_python.sh --no-lang

      - name: whisper-cli
        run: bash tools/whisper/build_whisper.sh

      - name: Compilation de transcribe et truchement
        run: bash compiler.sh

      - name: Essai de lancement
        run: |
          # Toujours en marche au bout de 25 s = démarrage réussi
          # (pas de « timeout » sous macOS : processus en arrière-plan)
          set +e
          failed=0
          for app in transcribe truchement; do
            ./"$app" > "$app.log" 2>&1 &
            pid=$!
            sleep 25
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; echo "$app : en marche"
            else
              wait "$pid"; echo "::error::$app s'est arrêté (code $?)"
              tail -20 "$app.log"; failed=1
            fi
          done
          build/whisper/whisper-cli --help > /dev/null || failed=1
          exit $failed

      - name: Archives
        run: |
          mkdir -p dist
          # scripts *.sh sauf compiler* (sources absentes de l'archive) ;
          # install_tk_xft.sh : appelé par setup_python.sh, sans effet ici
          scripts=$(ls *.sh | grep -v '^compiler')
          tar -cJf "dist/transcribe-macos-${{ matrix.arch }}.tar.xz" \
            transcribe truchement traduire-srt.py nettoyer-srt.py \
            traduire-livre.py assets i18n build/whisper \
            $scripts download_from_csv.py downloads.csv requirements.txt \
            tools/tk-xft/install_tk_xft.sh LICENSE README.md
          tar -C build/whisper -cJf "dist/whisper-cli-macos-${{ matrix.arch }}.tar.xz" whisper-cli
          file transcribe truchement build/whisper/whisper-cli
          codesign -dv transcribe 2>&1 | grep -i signature || true
          tar -tJf "dist/transcribe-macos-${{ matrix.arch }}.tar.xz" | grep -v '^assets/\|^i18n/\|^build/'
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.xz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Python portable (sans paquets de langues Argos)
        shell: cmd
        run: call setup_python.bat --no-lang || exit /b 1

      - name: Compilation de transcribe et truchement
        shell: cmd
        run: call compiler.bat || exit /b 1

      - name: Essai de lancement
        shell: pwsh
        run: |
          # Toujours en marche au bout de 30 s, sans fenêtre d'erreur
          # PyInstaller (« Unhandled exception… ») = démarrage réussi
          $failed = $false
          foreach ($app in 'transcribe', 'truchement') {
            $p = Start-Process -FilePath ".\$app.exe" -PassThru
            Start-Sleep -Seconds 30
            $titles = @(Get-Process -Name $app -ErrorAction SilentlyContinue |
                        ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
            if ($p.HasExited) {
              Write-Host "::error::$app s'est arrêté (code $($p.ExitCode))"; $failed = $true
            } elseif ($titles -match 'exception|error|erreur') {
              Write-Host "::error::$app : fenêtre d'erreur « $($titles -join ' | ') »"; $failed = $true
            } else {
              Write-Host "$app : en marche, fenêtre(s) : $($titles -join ' | ')"
            }
            taskkill /PID $p.Id /T /F 2>&1 | Out-Null
          }
          if ($failed) { exit 1 }

      - name: Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # scripts *.bat sauf compiler* (sources absentes de l'archive)
          $scripts = Get-ChildItem *.bat | Where-Object Name -notlike 'compiler*' |
                     ForEach-Object Name
          $files = @('transcribe.exe', 'truchement.exe', 'traduire-srt.py',
                     'nettoyer-srt.py', 'traduire-livre.py', 'assets', 'i18n',
                     'download_from_csv.py', 'downloads.csv', 'requirements.txt',
                     'LICENSE', 'README.windows.md') + $scripts
          7z a -tzip -mx=9 dist\transcribe-windows-x64.zip @files
          if ($LASTEXITCODE -ne 0) { exit 1 }
          7z l dist\transcribe-windows-x64.zip | Select-String -NotMatch '(assets|i18n)\\'
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  windows-arm64:
    name: Windows arm64 (archive x64 émulée)
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist

      - name: Décompression de l'archive x64
        shell: pwsh
        run: |
          Expand-Archive dist\transcribe-windows-x64.zip -DestinationPath cle
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.Version) — processeur : $env:PROCESSOR_ARCHITECTURE"

      - name: Python portable x64 (sans paquets de langues Argos)
        shell: cmd
        working-directory: cle
        run: call setup_python.bat --no-lang || exit /b 1

      - name: ffmpeg, whisper-cli et yt-dlp (lignes « win » de downloads.csv)
        shell: pwsh
        working-directory: cle
        run: |
          # lignes Windows seulement : pas de modèles Whisper ni de dictionnaires
          Select-String -Path downloads.csv -Pattern ',win(,|$)' |
            ForEach-Object Line | Set-Content -Encoding utf8 ci-downloads.csv
          Get-Content ci-downloads.csv
          .\build\python\venv-windows\python.exe -I download_from_csv.py ci-downloads.csv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\build\python\venv-windows\python.exe -c "import platform, sys; print('Python', sys.version.split()[0], platform.machine())"
          $failed = $false
          foreach ($c in @(@('build\ffmpeg\bin\ffmpeg.exe', '-version'),
                           @('build\whisper\whisper-cli.exe', '--help'),
                           @('build\yt-dlp\yt-dlp.exe', '--version'))) {
            & $c[0] $c[1] *> out.txt
            $rc = $LASTEXITCODE
            Write-Host "$($c[0]) : code $rc — $(Get-Content out.txt -TotalCount 1)"
            # whisper-cli --help rend 0 ou 1 selon les versions
            if ($rc -ne 0 -and -not ($c[0] -like '*whisper*' -and $rc -eq 1)) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Essai de lancement
        shell: pwsh
        working-directory: cle
        run: |
          $failed = $false
          foreach ($app in 'transcribe', 'truchement') {
            $p = Start-Process -FilePath ".\$app.exe" -PassThru
            Start-Sleep -Seconds 45
            $titles = @(Get-Process -Name $app -ErrorAction SilentlyContinue |
                        ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
            if ($p.HasExited) {
              Write-Host "::error::$app s'est arrêté (code $($p.ExitCode))"; $failed = $true
            } elseif ($titles -match 'exception|error|erreur') {
              Write-Host "::error::$app : fenêtre d'erreur « $($titles -join ' | ') »"; $failed = $true
            } else {
              Write-Host "$app : en marche, fenêtre(s) : $($titles -join ' | ')"
            }
            taskkill /PID $p.Id /T /F 2>&1 | Out-Null
          }
          if ($failed) { exit 1 }

  release:
    name: Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publication dans la release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" \
                 --notes "transcribe et truchement pour Linux (x86-64, arm64), Windows x64 et macOS (Apple Silicon, Intel)"
          gh release upload "$TAG" dist/* --clobber
